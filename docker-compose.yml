services:
  db:
    image: postgres:15-alpine
    container_name: portal_cidadao_db
    restart: unless-stopped
    ports:
      # Só o host local alcança o banco — nunca publicar Postgres pra fora
      # (mesmo em hml). Uma app de fora deste compose acessa via app/db-init.
      - "127.0.0.1:5434:5432"
    volumes:
      - portal_cidadao_data:/var/lib/postgresql/data
    environment:
      # Sem default: falha rápido se ninguém definiu uma senha real via .env —
      # não dá pra existir um "docker" hardcoded rodando em hml/produção.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=portal_cidadao
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_cidadao"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db-init:
    build:
      context: .
      target: builder
    container_name: portal_cidadao_db_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/portal_cidadao?schema=public
    # `prisma migrate deploy` já é idempotente (só aplica pendentes) — nada de
    # marker file: um `docker compose down -v` que reseta o volume do banco mas
    # não o bind mount do marker deixaria a app subir sem tabela nenhuma.
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  app:
    build:
      context: .
    container_name: portal_cidadao_app
    restart: unless-stopped
    ports:
      # Sem reverse proxy na frente (ainda não configurado), continua só
      # acessível do próprio host — nunca publicar a app direto pra internet.
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - path: .env
        required: false
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/portal_cidadao?schema=public
      - TRIBUTARIO_BASE_URL=${TRIBUTARIO_BASE_URL:-http://host.docker.internal:3000/api/v1}
      - PORT=3001
      - NODE_ENV=production
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(\"http://127.0.0.1:3001/api/health\").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  portal_cidadao_data:
